<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Kawaii Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Group with Soft Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- 1. Kawaii Set-Square Triangle Ruler (Background stationery) -->
    <!-- Triangle Ruler Body -->
    <path d="M 96 408 L 416 408 C 426 408 434 398 428 390 L 118 80 C 110 72 96 78 96 90 Z"
          fill="#38bdf8"
          stroke="#1e293b"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Triangle Ruler Highlight Accent -->
    <path d="M 120 130 L 380 390 L 120 390 Z"
          fill="#7dd3fc"
          opacity="0.6" />

    <!-- Triangle Ruler Inner Cutout -->
    <path d="M 156 364 L 336 364 C 344 364 350 356 344 350 L 174 180 C 168 174 156 178 156 188 Z"
          fill="#ffffff"
          stroke="#1e293b"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Set-Square Tick Marks along bottom edge -->
    <line x1="170" y1="408" x2="170" y2="384" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="205" y1="408" x2="205" y2="392" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="240" y1="408" x2="240" y2="384" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="275" y1="408" x2="275" y2="392" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="310" y1="408" x2="310" y2="384" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="345" y1="408" x2="345" y2="392" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="380" y1="408" x2="380" y2="384" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />

    <!-- Set-Square Tick Marks along vertical left edge -->
    <line x1="96" y1="334" x2="120" y2="334" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="96" y1="299" x2="112" y2="299" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="96" y1="264" x2="120" y2="264" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="96" y1="229" x2="112" y2="229" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="96" y1="194" x2="120" y2="194" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="96" y1="159" x2="112" y2="159" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />


    <!-- 2. Kawaii Cute Pencil (Diagonal crossing in Kawaii Lineal Color style) -->
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
      
      <!-- Pink Eraser (Rounded top) -->
      <path d="M 216 110 C 216 88 296 88 296 110 L 296 135 L 216 135 Z"
            fill="#fb7185"
            stroke="#1e293b"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- Eraser Shine -->
      <path d="M 230 100 C 236 94 250 94 256 94"
            stroke="#ffffff"
            stroke-width="6"
            stroke-linecap="round"
            fill="none" />

      <!-- Ferrule (Metal Band) -->
      <rect x="216" y="135" width="80" height="34" rx="4"
            fill="#e2e8f0"
            stroke="#1e293b"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round" />
      <line x1="216" y1="152" x2="296" y2="152" stroke="#94a3b8" stroke-width="6" />

      <!-- Yellow Pencil Main Body -->
      <rect x="216" y="169" width="80" height="175"
            fill="#facc15"
            stroke="#1e293b"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- Pencil Facet Stripes (Classic Kawaii Lineal 3-shade styling) -->
      <rect x="216" y="169" width="26" height="175" fill="#eab308" opacity="0.35" />
      <rect x="270" y="169" width="26" height="175" fill="#fde047" opacity="0.6" />
      <line x1="242" y1="169" x2="242" y2="344" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
      <line x1="270" y1="169" x2="270" y2="344" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />

      <!-- Kawaii Happy Face on Pencil -->
      <!-- Eyes -->
      <circle cx="236" cy="245" r="6" fill="#1e293b" />
      <circle cx="276" cy="245" r="6" fill="#1e293b" />
      <!-- Cute Eye Highlights -->
      <circle cx="234" cy="243" r="2" fill="#ffffff" />
      <circle cx="274" cy="243" r="2" fill="#ffffff" />
      <!-- Rosy Blush Cheeks -->
      <ellipse cx="228" cy="254" rx="6" ry="4" fill="#fb7185" opacity="0.75" />
      <ellipse cx="284" cy="254" rx="6" ry="4" fill="#fb7185" opacity="0.75" />
      <!-- Cute Smile -->
      <path d="M 250 252 Q 256 258 262 252"
            fill="none"
            stroke="#1e293b"
            stroke-width="4.5"
            stroke-linecap="round" />

      <!-- Sharpened Wooden Tip (Scalloped cut) -->
      <path d="M 216 344 L 256 415 L 296 344 C 283 350 269 350 256 344 C 243 350 229 350 216 344 Z"
            fill="#fed7aa"
            stroke="#1e293b"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- Graphite Pencil Lead Tip -->
      <path d="M 243 392 L 256 415 L 269 392 Z"
            fill="#334155"
            stroke="#1e293b"
            stroke-width="8"
            stroke-linejoin="round" />
    </g>

    <!-- 3. Kawaii Sparkles & Stars around the Stationery -->
    <!-- Star Sparkle Top Right -->
    <path d="M 412 120 Q 412 138 394 138 Q 412 138 412 156 Q 412 138 430 138 Q 412 138 412 120 Z"
          fill="#facc15"
          stroke="#1e293b"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Mini Circle Sparkle -->
    <circle cx="436" cy="180" r="7" fill="#fb7185" stroke="#1e293b" stroke-width="4" />

    <!-- Star Sparkle Bottom Left -->
    <path d="M 80 320 Q 80 332 68 332 Q 80 332 80 344 Q 80 332 92 332 Q 80 332 80 320 Z"
          fill="#38bdf8"
          stroke="#1e293b"
          stroke-width="4"
          stroke-linejoin="round" />

    <!-- Mini Dot Sparkle Top Left -->
    <circle cx="150" cy="70" r="6" fill="#fde047" stroke="#1e293b" stroke-width="4" />
  </g>
</svg>