<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for clean render -->
  </defs>
  <!-- Background with subtle soft rounded rect -->
  <rect width="512" height="512" rx="100" fill="#ffffff"/>
  
  <!-- Corner Brackets around Cube -->
  <!-- Top-left bracket -->
  <path d="M 175 105 L 165 105 A 12 12 0 0 0 153 117 L 153 127" fill="none" stroke="#18181B" stroke-width="15" stroke-linecap="round"/>
  <!-- Top-right bracket -->
  <path d="M 405 105 L 415 105 A 12 12 0 0 1 427 117 L 427 127" fill="none" stroke="#18181B" stroke-width="15" stroke-linecap="round"/>
  <!-- Bottom-left bracket -->
  <path d="M 153 315 L 153 325 A 12 12 0 0 0 165 337 L 175 337" fill="none" stroke="#18181B" stroke-width="15" stroke-linecap="round"/>
  <!-- Bottom-right bracket -->
  <path d="M 427 315 L 427 325 A 12 12 0 0 1 415 337 L 405 337" fill="none" stroke="#18181B" stroke-width="15" stroke-linecap="round"/>

  <!-- 3D Cube -->
  <!-- Top face -->
  <polygon points="290,140 375,190 290,240 205,190" fill="#BCE0FD" stroke="#18181B" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left face -->
  <polygon points="205,190 290,240 290,340 205,290" fill="#88BCF8" stroke="#18181B" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right face -->
  <polygon points="290,240 375,190 375,290 290,340" fill="#6097E8" stroke="#18181B" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- L-Shaped Ruler -->
  <!-- Main L-body path -->
  <path d="M 45 45 
           C 45 35, 55 25, 70 25 
           L 100 25 
           C 115 25, 125 35, 125 45 
           L 125 385 
           L 465 385 
           C 475 385, 485 395, 485 410 
           L 485 440 
           C 485 455, 475 465, 465 465 
           L 70 465 
           C 45 465, 25 445, 25 420 
           L 25 70 
           C 25 55, 35 45, 45 45 Z"
        fill="#82D2A2" stroke="#18181B" stroke-width="15" stroke-linejoin="round"/>

  <!-- Vertical Leg Ticks -->
  <line x1="125" y1="80" x2="95" y2="80" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="125" y1="120" x2="105" y2="120" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="125" y1="160" x2="90" y2="160" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="125" y1="200" x2="105" y2="200" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="125" y1="240" x2="90" y2="240" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="125" y1="280" x2="105" y2="280" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="125" y1="320" x2="90" y2="320" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Corner & Horizontal Leg Ticks -->
  <line x1="160" y1="385" x2="160" y2="415" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="200" y1="385" x2="200" y2="405" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="240" y1="385" x2="240" y2="420" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="280" y1="385" x2="280" y2="405" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="320" y1="385" x2="320" y2="420" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="360" y1="385" x2="360" y2="405" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
  <line x1="400" y1="385" x2="400" y2="420" stroke="#18181B" stroke-width="14" stroke-linecap="round"/>
  <line x1="440" y1="385" x2="440" y2="405" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>

  <!-- Highlight bevel on green ruler -->
  <path d="M 40 45 L 40 420 C 40 435, 50 445, 65 445 L 460 445" fill="none" stroke="#A7E5BF" stroke-width="7" stroke-linecap="round"/>
</svg>
