<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Background (Apple squircle mask will clip this smoothly) -->
  <rect width="512" height="512" fill="#0f172a"/>
  
  <!-- Subtle Blueprint Grid Pattern in Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Centered Diagonal Ruler (45 degrees) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Drop shadow underneath ruler -->
    <rect x="56" y="196" width="400" height="120" rx="14" fill="#000000" opacity="0.35"/>
    
    <!-- Ruler Main Body: Tajima Engineering Vibrant Yellow -->
    <rect x="56" y="190" width="400" height="120" rx="12" fill="#facc15" stroke="#eab308" stroke-width="4"/>
    
    <!-- Beveled top reflection line -->
    <line x1="68" y1="194" x2="444" y2="194" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>

    <!-- Hanging hole on left end -->
    <circle cx="95" cy="250" r="14" fill="#0f172a" stroke="#ca8a04" stroke-width="3"/>

    <!-- Ruler Tick Marks along Top Edge (high-contrast deep black) -->
    <!-- 1 cm (Major) -->
    <line x1="140" y1="190" x2="140" y2="242" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="162" y1="190" x2="162" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="184" y1="190" x2="184" y2="228" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="206" y1="190" x2="206" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 2 cm (Major) -->
    <line x1="228" y1="190" x2="228" y2="242" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="190" x2="250" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="272" y1="190" x2="272" y2="228" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="294" y1="190" x2="294" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 3 cm (Major) -->
    <line x1="316" y1="190" x2="316" y2="242" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="338" y1="190" x2="338" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="360" y1="190" x2="360" y2="228" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="382" y1="190" x2="382" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 4 cm (Major) -->
    <line x1="404" y1="190" x2="404" y2="242" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="426" y1="190" x2="426" y2="216" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Numbers (1, 2, 3, 4) in bold, crystal clear sans-serif -->
    <text x="140" y="278" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">1</text>
    <text x="228" y="278" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">2</text>
    <text x="316" y="278" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">3</text>
    <text x="404" y="278" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">4</text>
    
    <!-- Unit label 'cm' -->
    <text x="438" y="286" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="800" fill="#713f12" text-anchor="end">cm</text>
  </g>
</svg>
